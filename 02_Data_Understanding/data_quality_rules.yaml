EF2024:
    source_name: "Real_2024"
    domain: "Estados Financieros"
    type: "Agregado"
    grain: "1 fila por clasificación contable agregada y mes"
    expected_sheets:
      - "Real_2024"
    notes: "Fuente histórica agregada. No contiene detalle por centro de costo ni movimiento individual."
    rules:
      - id: "EF2024_R001"
        column: "MES"
        dimension: "Validez"
        rule: "Mes contable válido"
        expectation: "Debe ser numérico y estar entre 1 y 12."
        severity: "Alta"

      - id: "EF2024_R002"
        column: "CLASIFICACION"
        dimension: "Completitud"
        rule: "Clasificación original obligatoria"
        expectation: "No debe contener valores nulos o vacíos. Es la original antes de la limpieza."
        severity: "Alta"

      - id: "EF2024_R003"
        column: "CLASIFICACION_CLEAN"
        dimension: "Integridad referencial"
        rule: "Clasificación homologada válida"
        expectation: "Debe existir en TABLA_GRUPOS para permitir comparativos históricos."
        severity: "Alta"

      - id: "EF2024_R004"
        column: "TIPO_CUENTA"
        dimension: "Validez"
        rule: "Tipo de cuenta válido"
        expectation: "Debe corresponder a valores esperados como INGRESOS o GASTOS Y COSTOS."
        severity: "Alta"

      - id: "EF2024_R005"
        column: "TIPO_CUENTA_1"
        dimension: "Validez"
        rule: "Subtipo de cuenta válido"
        expectation: "Debe corresponder a valores esperados como INGRESOS, COSTOS o GASTOS."
        severity: "Alta"

      - id: "EF2024_R006"
        column: "NETO_AJUSTADO"
        dimension: "Validez"
        rule: "Valor financiero ajustado válido"
        expectation: "Debe ser numérico y conservar el signo financiero definido para la clasificación."
        severity: "Alta"

      - id: "EF2024_R007"
        column: "ANIO"
        dimension: "Exactitud"
        rule: "Año histórico correcto"
        expectation: "Debe ser igual a 2024 en todos los registros."
        severity: "Alta"

      - id: "EF2024_R008"
        column: "CLASIFICACION_CLEAN"
        dimension: "Consistencia"
        rule: "Homologación consistente"
        expectation: "Debe mantener una relación coherente con CLASIFICACION original."
        severity: "Media"

