project:
  name: "Cierre Contable - Modelo BI Financiero"
  methodology: "ASUM-DM"
  phase: "02_Data_Understanding"
  artifact: "data_quality_rules"
  owner: "Analytics"
  description: "Reglas de calidad aplicables a las fuentes financieras, presupuestales, de balance y dimensiones del modelo BI."

quality_dimensions:
  - Completitud
  - Validez
  - Consistencia
  - Integridad referencial
  - Unicidad
  - Exactitud

severity_definition:
  Alta: "Afecta integridad financiera o cruces críticos."
  Media: "Afecta análisis o categorización."
  Baja: "Afecta trazabilidad o enriquecimiento."

EF2026:
    source_name: "Real_2026"
    domain: "Estados Financieros"
    type: "Transaccional"
    grain: "1 fila por movimiento financiero"
    expected_sheets:
      - "Real_2026_1"
    notes: "Fuente transaccional principal del modelo. Para 2026 se valida únicamente hasta el último mes contable cargado."
    rules:
      - id: "EF2026_R001"
        column: "MES"
        dimension: "Validez"
        rule: "Mes contable válido"
        expectation: "El valor debe ser numérico y estar entre 1 y 12. Para 2026 debe existir solo hasta el mes cargado oficialmente."
        severity: "Alta"

      - id: "EF2026_R002"
        column: "CUENTA"
        dimension: "Completitud"
        rule: "Nivel de cuenta obligatorio"
        expectation: "Debe iniciar con N y no debe contener valores nulos o vacíos."
        severity: "Alta"

      - id: "EF2026_R003"
        column: "CODIGO_CONTABLE" 
        dimension: "Completitud"
        rule: "Código contable obligatorio"
        expectation: "No debe contener valores nulos o vacíos."
        severity: "Alta"

      - id: "EF2026_R004"
        column: "CODIGO_CONTABLE"
        dimension: "Validez"
        rule: "Formato de código contable válido"
        expectation: "Debe iniciar con N y contener la estructura contable esperada."
        severity: "Alta"

      - id: "EF2026_R005"
        column: "L_PLACON_NOMBRE_CUENTA"
        dimension: "Completitud"
        rule: "Nombre de cuenta obligatorio"
        expectation: "Toda cuenta contable debe tener una descripción asociada."
        severity: "Media"

      - id: "EF2026_R006"
        column: "CENTRO_COSTO"
        dimension: "Completitud"
        rule: "Centro de costo obligatorio"
        expectation: "No debe contener valores nulos a menos que sea un AJUSTE AL PESO en la cuenta"
        severity: "Alta"

      - id: "EF2026_R007"
        column: "CENTRO_COSTO"
        dimension: "Integridad referencial"
        rule: "Centro de costo existente"
        expectation: "Debe existir en la dimensión CECOS."
        severity: "Alta"

      - id: "EF2026_R008"
        column: "L_CENCOS_NOMBRE_CENTRO_COSTO"
        dimension: "Completitud"
        rule: "Nombre de centro de costo obligatorio"
        expectation: "Todo centro de costo debe tener descripción funcional a menos que sea un AJUSTE AL PESO en la cuenta."
        severity: "Media"

      - id: "EF2026_R009"
        column: "TERCERO"
        dimension: "Completitud"
        rule: "Nombre de tercero obligatorio"
        expectation: "Debe tener un tercero asociado."
        severity: "Media"

      - id: "EF2026_R010"
        column: "FONDO"
        dimension: "Completitud"
        rule: "Código fondo obligatorio"
        expectation: "No debe contener valores nulos o vacíos."
        severity: "Alta"

      - id: "EF2026_R011"
        column: "Suma de NETO"
        dimension: "Validez"
        rule: "Valor financiero numérico"
        expectation: "Debe ser numérico y conservar el signo contable original."
        severity: "Alta"

      - id: "EF2026_R012"
        column: "FUENTE_FUNCION"
        dimension: "Completitud"
        rule: "Fuente o función obligatoria"
        expectation: "No debe estar vacía a menos que sea un AJUSTE AL PESO en la cuenta."
        severity: "Media"

      - id: "EF2026_R013"
        column: "DESCRIPCION"
        dimension: "Completitud"
        rule: "Descripción del movimiento"
        expectation: "Debe contener información descriptiva del documento o movimiento financiero cuando esté disponible."
        severity: "Baja"

      - id: "EF2026_R014"
        column: "L_PERS_IDENTIFICACION"
        dimension: "Validez"
        rule: "Identificación válida"
        expectation: "Debe ser numérica cuando aplique. Puede estar vacía solo si el movimiento no está asociado a tercero/persona."
        severity: "Media"

      - id: "EF2026_R015"
        column: "Llave"
        dimension: "Completitud"
        rule: "Llave de cruce obligatoria"
        expectation: "Debe existir para permitir cruces"
        severity: "Alta"

      - id: "EF2026_R016"
        column: "Llave"
        dimension: "Consistencia"
        rule: "Llave coherente"
        expectation: "Debe corresponder a la concatenación lógica entre CODIGO_CONTABLE y CENTRO_COSTO."
        severity: "Alta"

      - id: "EF2026_R017"
        column: "Clasificacion"
        dimension: "Integridad referencial"
        rule: "Clasificación financiera válida"
        expectation: "Debe existir en TABLA_GRUPOS para construir el Estado de Resultados,es la originalantes de la limpieza"
        severity: "Alta"

      - id: "EF2026_R018"  
        column: "Cuentas a 6"
        dimension: "Consistencia"
        rule: "Cuenta agrupada a 6 dígitos válida"
        expectation: "Debe derivarse correctamente del CODIGO_CONTABLE."
        severity: "Media"

      - id: "EF2026_R019"
        column: "Cuentas a 4 y Descuentos"
        dimension: "Consistencia"
        rule: "Cuenta agrupada a 4 dígitos válida"
        expectation: "Debe derivarse correctamente del CODIGO_CONTABLE."
        severity: "Media"

      - id: "EF2026_R020"
        column: "CLAF3"
        dimension: "Completitud"
        rule: "Clasificación complementaria válida"
        expectation: "Debe tener valor de facultad, área o 0 cuando no aplique."
        severity: "Media"

