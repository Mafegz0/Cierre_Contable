Dim_cecos:
    source_name: "CECOS"
    domain: "Centros de Costo"
    type: "Referencial"
    grain: "1 fila por centro de costo"
    expected_sheets:
      - "CECOS"
    notes: "Dimensión referencial utilizada para homologar centros de costo, facultades, programas, áreas y modalidad académica."
    rules:
      - id: "CECOS_R001"
        column: "CENTRO_COSTO"
        dimension: "Completitud"
        rule: "Centro de costo obligatorio"
        expectation: "No debe contener valores nulos o vacíos."
        severity: "Alta"

      - id: "CECOS_R002"
        column: "CENTRO_COSTO"
        dimension: "Unicidad"
        rule: "Centro de costo único"
        expectation: "Cada CENTRO_COSTO debe aparecer una sola vez en la dimensión."
        severity: "Alta"

      - id: "CECOS_R003"
        column: "CENTRO_COSTO"
        dimension: "Validez"
        rule: "Formato de centro de costo válido"
        expectation: "Debe ser numérico o seguir la estructura oficial definida por la organización."
        severity: "Alta"

      - id: "CECOS_R004"
        column: "NOMBRE_CENTRO_COSTO"
        dimension: "Completitud"
        rule: "Nombre de centro de costo obligatorio"
        expectation: "Todo centro de costo debe tener descripción funcional."
        severity: "Alta"

      - id: "CECOS_R005"
        column: "Facultades"
        dimension: "Completitud"
        rule: "Facultad obligatoria"
        expectation: "Todo centro de costo académico debe tener facultad asociada. Si no tiene facultad, se consideran áreas administrativas"
        severity: "Media"

      - id: "CECOS_R006"
        column: "Programas"
        dimension: "Completitud"
        rule: "Programa obligatorio"
        expectation: "Los centros académicos deben tener programa asociado y en caso de ser áreas administrativas, aparece su nombre."
        severity: "Media"

      - id: "CECOS_R007"
        column: "Área"
        dimension: "Completitud"
        rule: "Área funcional obligatoria"
        expectation: "Debe existir una clasificación funcional o académica, igual que en facultad si no tiene area asociada se deja el nombre de la facultad"
        severity: "Media"

      - id: "CECOS_R008"
        column: "Clase"
        dimension: "Validez"
        rule: "Clase organizacional válida"
        expectation: "Debe corresponder a categorías válidas como Pregrado, PostGrado o Administrativa, tiene nulos."
        severity: "Media"

      - id: "CECOS_R009"
        column: "Tipo"
        dimension: "Validez"
        rule: "Tipo organizacional válido"
        expectation: "Debe corresponder a una clasificación organizacional reconocida, tiene nulos."
        severity: "Media"

      - id: "CECOS_R010"
        column: "Modalidad"
        dimension: "Validez"
        rule: "Modalidad válida"
        expectation: "Debe corresponder a modalidades reconocidas como Presencial, Virtual o Distancia, tiene nulos."
        severity: "Media"

      - id: "CECOS_R011"
        column: "CENTRO_COSTO"
        dimension: "Integridad referencial"
        rule: "Centro de costo utilizado en hechos"
        expectation: "Debe poder cruzar con EF2026, EF2025 y Presupuesto_2026."
        severity: "Alta"

      - id: "CECOS_R012"
        column: "NOMBRE_CENTRO_COSTO"
        dimension: "Consistencia"
        rule: "Consistencia entre código y nombre"
        expectation: "Cada CENTRO_COSTO debe mantener un único nombre asociado."
        severity: "Alta"

Dim_clasificacion:
    source_name: "TABLA_GRUPOS"
    domain: "Dimension EF"
    type: "Referencial"
    grain: "1 fila por clasificación financiera"
    expected_sheets:
      - "TABLA_GRUPOS"
    notes: "Dimensión principal utilizada para construir el Estado de Resultados y clasificar ingresos, costos y gastos."
    rules:
      - id: "DIM_EF_R001"
        column: "CLASIFICACION"
        dimension: "Completitud"
        rule: "Clasificación financiera obligatoria"
        expectation: "No debe contener valores nulos o vacíos."
        severity: "Alta"

      - id: "DIM_EF_R002"
        column: "CLASIFICACION"
        dimension: "Unicidad"
        rule: "Clasificación única"
        expectation: "Cada clasificación debe aparecer una sola vez en la dimensión."
        severity: "Alta"

      - id: "DIM_EF_R003"
        column: "GRUPO_MACRO"
        dimension: "Completitud"
        rule: "Grupo macro obligatorio"
        expectation: "Toda clasificación debe pertenecer a un grupo macro financiero."
        severity: "Alta"

      - id: "DIM_EF_R004"
        column: "CLAF_ORDER"
        dimension: "Validez"
        rule: "Orden financiero válido"
        expectation: "Debe ser numérico y permitir ordenar correctamente el Estado de Resultados."
        severity: "Alta"

      - id: "DIM_EF_R005"
        column: "TIPO_CUENTA"
        dimension: "Validez"
        rule: "Tipo de cuenta válido"
        expectation: "Debe corresponder a categorías válidas como INGRESOS, COSTOS o GASTOS."
        severity: "Alta"

      - id: "DIM_EF_R006"
        column: "CLASIFICACION"
        dimension: "Integridad referencial"
        rule: "Clasificación utilizada en hechos"
        expectation: "Debe poder cruzar con EF2026, EF2025, EF2024 y Presupuesto."
        severity: "Alta"

      - id: "DIM_EF_R007"
        column: "GRUPO_MACRO"
        dimension: "Consistencia"
        rule: "Jerarquía financiera consistente"
        expectation: "Cada clasificación debe pertenecer únicamente a un grupo macro."
        severity: "Alta"

Dim_clas_balance:
    source_name: "BALANCE_GRUPOS"
    domain: "DimensionBAL"
    type: "Referencial"
    grain: "1 fila por clasificación de balance"
    expected_sheets:
      - "BALANCE_GRUPOS"
    notes: "Dimensión utilizada para clasificar cuentas del Balance General en Activo, Pasivo y Patrimonio."
    rules:
      - id: "DIM_BAL_R001"
        column: "Clasificacion"
        dimension: "Completitud"
        rule: "Clasificación de balance obligatoria"
        expectation: "No debe contener valores nulos o vacíos."
        severity: "Alta"

      - id: "DIM_BAL_R002"
        column: "Clasificacion"
        dimension: "Unicidad"
        rule: "Clasificación única"
        expectation: "Cada clasificación debe aparecer una sola vez en la dimensión."
        severity: "Alta"

      - id: "DIM_BAL_R003"
        column: "Clasificacion_1"
        dimension: "Validez"
        rule: "Naturaleza financiera válida"
        expectation: "Debe corresponder a ACTIVO, PASIVO o PATRIMONIO."
        severity: "Alta"

      - id: "DIM_BAL_R004"
        column: "Clasificacion_2"
        dimension: "Validez"
        rule: "Subclasificación válida"
        expectation: "Debe corresponder a categorías válidas como Activo Corriente, Pasivo Corriente o Patrimonio."
        severity: "Alta"

      - id: "DIM_BAL_R005"
        column: "orden"
        dimension: "Validez"
        rule: "Orden de presentación válido"
        expectation: "Debe ser numérico y permitir ordenar correctamente el Balance General."
        severity: "Alta"

      - id: "DIM_BAL_R006"
        column: "Clasificacion"
        dimension: "Integridad referencial"
        rule: "Clasificación utilizada en balances"
        expectation: "Debe poder cruzar con BAL2026 y BAL2025."
        severity: "Alta"

      - id: "DIM_BAL_R007"
        column: "Clasificacion"
        dimension: "Consistencia"
        rule: "Clasificación coherente con jerarquía financiera"
        expectation: "Cada clasificación debe pertenecer únicamente a una naturaleza financiera principal."
        severity: "Alta"